<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Manuver</title>
  <meta name="description" content="Manuver Builder Dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/dashboard.css">
</head>
<body>
  <!-- Neutral Session Checking Loading State (Prevents Flash of Unauthenticated Content) -->
  <div id="dashboard-loader" role="status" aria-live="polite">
    <div class="loader-spinner" aria-hidden="true"></div>
    <span class="loader-text" data-i18n="dashboard.loading">Loading dashboard...</span>
  </div>

  <!-- Authenticated Dashboard UI Container -->
  <div id="dashboard-app" aria-hidden="false">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/" class="wordmark" data-i18n-aria="dashboard.logoAria" aria-label="Manuver Dashboard">
          Manuver
        </a>

        <div class="topbar-right">
          <!-- Language Selection Segmented Control -->
          <div class="lang-switch" role="group" aria-label="Language selection">
            <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" class="lang-btn" data-lang="id" aria-pressed="false">ID</button>
          </div>

          <!-- User Profile -->
          <div class="user-profile" id="user-profile-badge">
            <span id="user-avatar-slot">
              <span class="user-initials" aria-hidden="true">M</span>
            </span>
            <span class="user-name" id="user-display-name">Builder</span>
          </div>

          <!-- Sign Out Action -->
          <button type="button" id="btn-signout" class="btn-signout" data-i18n="dashboard.signOut" data-i18n-aria="dashboard.signOutAria">
            Sign out
          </button>
        </div>
      </div>
    </header>

    <!-- Center Empty State -->
    <main class="main-content">
      <section class="empty-state-card" aria-labelledby="empty-headline">
        <div class="empty-icon-wrap" aria-hidden="true">
          <!-- Clean minimal connector / webhook SVG icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </div>

        <h1 id="empty-headline" class="empty-headline" data-i18n="dashboard.emptyTitle">
          No tools connected yet
        </h1>

        <p class="empty-description" data-i18n="dashboard.emptyDesc">
          Connect your first tool to start automating your workflows and speeding up manual execution.
        </p>

        <button type="button" id="btn-connect-first" class="btn-primary-connect" data-i18n="dashboard.connectBtn">
          Connect your first tool
        </button>
      </section>
    </main>
  </div>

  <!-- Connector Modal Dialog -->
  <div id="connect-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title">
    <div class="modal-dialog">
      <div class="modal-badge" data-i18n="dashboard.modalBadge">
        Connectors
      </div>
      <h2 id="modal-title" class="modal-title" data-i18n="dashboard.modalTitle">
        First connector in preparation
      </h2>
      <p class="modal-desc" data-i18n="dashboard.modalDesc">
        The first connector is currently being prepared. We will notify you as soon as it is ready.
      </p>
      <div class="modal-footer">
        <button type="button" id="btn-modal-close" class="btn-modal-close" data-i18n="dashboard.modalClose">
          Understood
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
