<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuver</title>
<meta name="description" content="Manual work slows teams down. Manuver automates the repetitive parts so you can build and move first.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1f1f21;
    --ink:#f4f3f0;
    --dim:rgba(244,243,240,.60);
    --faint:rgba(244,243,240,.40);
    --line:rgba(255,255,255,.12);
    --line-2:rgba(255,255,255,.20);
    --accent:#ff572f;
    --pad:clamp(20px,3.4vw,52px);
  }
  *{box-sizing:border-box}
  html{ -webkit-text-size-adjust:100%; scroll-behavior: smooth; }
  html,body{margin:0;background:var(--bg)}
  body{
    color:var(--ink); min-height:100dvh; overflow-x:hidden; overflow-y:auto; overscroll-behavior:none;
    font-family:"Geist",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- layout wrapper ---------- */
  .layout-wrapper{
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 64px;
    width: 100%;
  }

  /* ---------- navigation ---------- */
  .nav-header{
    position: relative;
    z-index: 10;
    width: 100%;
  }
  .nav{
    display: flex;
    align-items: center;
    gap: clamp(20px, 3vw, 44px);
    padding-top: clamp(18px, 2.3vw, 28px);
    padding-bottom: clamp(18px, 2.3vw, 28px);
  }
  .logo{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    user-select: none;
    flex: 0 0 auto;
  }
  .logo-word{
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: clamp(26px, 2.8vw, 32px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: #ffffff;
    display: inline-block;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    /* 3D dimensional extrusion with ambient occlusion */
    text-shadow:
      0 1px 0 #dedcd7,
      0 2px 0 #bfbdb8,
      0 3px 0 #9f9e98,
      0 4px 0 #7e7d78,
      0 5px 0 #585753,
      0 6px 1px rgba(0, 0, 0, 0.4),
      0 8px 12px rgba(0, 0, 0, 0.5),
      0 14px 22px rgba(0, 0, 0, 0.35);
    transition: transform 0.25s cubic-bezier(0.2, 0.7, 0.3, 1), text-shadow 0.25s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .logo:hover .logo-word{
    transform: translateY(-2px);
    text-shadow:
      0 1px 0 #ffffff,
      0 2px 0 #dedcd7,
      0 3px 0 #bfbdb8,
      0 4px 0 #9f9e98,
      0 5px 0 #7e7d78,
      0 6px 0 #585753,
      0 7px 1px rgba(0, 0, 0, 0.45),
      0 10px 14px rgba(0, 0, 0, 0.55),
      0 18px 26px rgba(0, 0, 0, 0.4);
  }
  .navend{ margin-left:auto; display:flex; align-items:center; gap:clamp(10px,1.4vw,18px) }
  .navend .sign{
    font-size:14.5px;
    color:var(--dim);
    transition:color .2s ease;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    padding:6px 12px;
  }
  .navend .sign:hover{ color:var(--ink) }

  /* ---------- language toggle (segmented control) ---------- */
  .lang-switch{
    display: inline-flex;
    align-items: center;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    box-sizing: border-box;
    height: 36px;
  }
  .lang-btn{
    background: transparent;
    border: none;
    border-radius: 999px;
    color: var(--dim);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 4px 11px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    line-height: 1.2;
    height: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .lang-btn:hover{
    color: var(--ink);
  }
  .lang-btn.active{
    background: var(--ink);
    color: #17171a;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    cursor: default;
  }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
        border-radius:999px; font-weight:600; letter-spacing:-.012em; white-space:nowrap;
        font-family:inherit; cursor:pointer; text-decoration:none;
        transition:transform .25s cubic-bezier(.2,.7,.3,1), background .2s ease, border-color .2s ease, box-shadow .2s ease }
  .btn:active{ transform:translateY(1px) }
  .btn.sm{ font-size:13.5px; padding:8px 18px; min-height:38px }
  .btn.lg{ font-size:15px; padding:13px 26px; min-height:48px }
  .btn.solid{ background:var(--ink); color:#17171a; border:1px solid transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.2) }
  .btn.solid:hover{ background:#ffffff; box-shadow: 0 4px 14px rgba(0,0,0,0.3) }
  .btn.ghost{ border:1px solid var(--line-2); color:var(--ink); background:transparent }
  .btn.ghost:hover{ border-color:rgba(255,255,255,.45); background:rgba(255,255,255,.05) }
  .btn .arrow{ transition:transform .3s cubic-bezier(.2,.7,.3,1) }
  .btn:hover .arrow{ transform:translateX(3px) }

  /* ---------- HERO SECTION & SPATIAL CANVAS ---------- */
  .hero-main{
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .hero-particles-canvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    display: block;
  }
  .hero-main .layout-wrapper{
    position: relative;
    z-index: 2;
  }
  .hero-grid{
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 48px;
    align-items: center;
    width: 100%;
    padding: 32px 0 64px;
  }

  /* LEFT column: Content */
  .hero-left{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
    max-width: 580px;
  }
  .badge{ display:inline-flex; align-items:center; gap:9px;
          padding:5px 13px 5px 10px; border-radius:999px;
          border:1px solid var(--line); background:rgba(255,255,255,.045);
          font-size:12.5px; color:var(--dim); letter-spacing:-.006em }
  .badge i{ width:6px; height:6px; border-radius:999px; background:#4ade80;
            box-shadow:0 0 0 3px rgba(74,222,128,.18) }
  .lead{
    margin:0; font-weight:700;
    font-size:clamp(44px,5vw,72px); max-width:600px; line-height:1.05; letter-spacing:-.04em;
  }
  .lead .orange{ color:var(--accent); display:block }
  .lede{ margin:0; font-size:clamp(14.5px,1.05vw,15.5px);
         max-width:480px; line-height:1.5; color:var(--dim); letter-spacing:-.006em }
  .cta{ display:flex; flex-wrap:wrap; gap:12px; margin:0 }
  .pain-points{ display:flex; flex-direction:column; gap:10px; margin:0 }
  .pain-item{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); letter-spacing:-.004em }
  .pain-item svg{ width:13px; height:13px; color:var(--accent); flex-shrink:0; opacity:.85 }

  /* RIGHT column: SaaS UI Sphere with Atmospheric Sync */
  .hero-right{
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 480px;
    z-index: 3;
  }
  .stage{
    position: relative;
    width: min(38vw, 600px);
    aspect-ratio: 1;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }
  /* Luminous cyan/blue aura behind the sphere, perfectly matching background particles */
  .stage::before{
    content: '';
    position: absolute;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.28) 0%, rgba(0, 102, 255, 0.16) 42%, rgba(0, 30, 80, 0.04) 64%, transparent 72%);
    filter: blur(44px);
    pointer-events: none;
    z-index: 1;
    opacity: 0.88;
    animation: orbAuraPulse 6s ease-in-out infinite alternate;
  }
  @keyframes orbAuraPulse{
    0% { transform: scale(0.95); opacity: 0.72; }
    100% { transform: scale(1.08); opacity: 0.96; }
  }
  #orb{
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    z-index: 2;
  }
  #orb.dragging{ cursor: grabbing }

  /* Responsive / Mobile */
  @media (max-width:900px){
    body{ height:auto; min-height:100dvh; overflow-y:auto }
    .layout-wrapper{ padding: 0 24px; }
    .hero-main{ min-height: auto; }
    .hero-grid{
      grid-template-columns: 1fr;
      gap: 40px;
      padding: 20px 0 48px;
    }
    .hero-left{ order: 1; }
    .hero-right{ order: 2; min-height: auto; }
    .stage{
      width: 60vw;
      max-width: 480px;
      margin: 0 auto;
    }
  }
  @media (max-width:480px){
    .layout-wrapper{ padding: 0 18px; }
    .hero-grid{ gap: 28px; padding: 12px 0 36px; }
    .lead{ font-size: 38px; }
    .cta{ width: 100%; flex-direction: column; }
    .btn.lg{ width: 100%; }
    .navend .sign{ font-size: 13.5px; padding: 4px 8px; }
  }
  @media (max-width:420px){ .navend .sign{ display:inline-flex; } }
  @media (prefers-reduced-motion:reduce){ .btn,.btn .arrow{ transition:none } }
</style>
</head>
<body>

<header class="nav-header">
  <div class="layout-wrapper">
    <div class="nav">
      <a class="logo" href="#" aria-label="Manuver home" spellcheck="false">
        <span class="logo-word" spellcheck="false" translate="no">Manuver</span>
      </a>
      <div class="navend">
        <div class="lang-switch" role="group" aria-label="Language selection" data-i18n-aria="nav.langLabel">
          <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-btn" data-lang="id" aria-pressed="false">ID</button>
        </div>
        <button id="sign-in-link" class="sign" type="button" data-i18n="nav.signIn">Sign in</button>
        <button id="google-login" class="btn sm solid" type="button" data-i18n="nav.getStarted">Get started</button>
      </div>
    </div>
  </div>
</header>

<main class="hero-main">
  <!-- 3D Cinematic Spatial Particle Viewport -->
  <canvas id="hero-particles" class="hero-particles-canvas"></canvas>

  <div class="layout-wrapper">
    <div class="hero-grid">
      <!-- LEFT column -->
      <div class="hero-left">
        <span class="badge"><i></i><span data-i18n="hero.badge">The cost of moving slow</span></span>
        <h1 class="lead">
          <span data-i18n="hero.titleLine1">Slow Doesn&rsquo;t Scale.</span><br>
          <span class="orange" data-i18n="hero.titleLine2">Manuver Does.</span>
        </h1>
        <p class="lede" data-i18n="hero.lede">
          Manual work slows teams down. Manuver automates the repetitive parts so you can build and move first.
        </p>
        <div class="cta">
          <a class="btn lg solid" id="hero-start-building" href="#chat"><span data-i18n="hero.ctaStart">Start building</span></a>
          <a class="btn lg ghost" href="#services"><span data-i18n="hero.ctaHow">See how it works</span> <span class="arrow">&rarr;</span></a>
        </div>
        <div class="pain-points">
          <div class="pain-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h10M3 4h10M3 12h6"/></svg>
            <span data-i18n="hero.pain1">Tasks pile up</span>
          </div>
          <div class="pain-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 10l-2 2a2.8 2.8 0 01-4-4l2-2a2.8 2.8 0 014 0M10 6l2-2a2.8 2.8 0 014 4l-2 2a2.8 2.8 0 01-4 0M5 11l6-6"/></svg>
            <span data-i18n="hero.pain2">Tools don&rsquo;t connect</span>
          </div>
          <div class="pain-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
            <span data-i18n="hero.pain3">Ideas wait in the queue</span>
          </div>
        </div>
      </div>

      <!-- RIGHT column: 3D Stage with Synchronized SaaS UI Sphere -->
      <div class="hero-right">
        <div class="stage">
          <canvas id="orb"></canvas>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- High-Converting Interactive Sections Container -->
<div id="landing-sections"></div>

<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script type="module" src="/main.js"></script>
<script type="module" src="/src/spatialHero.js"></script>
<script type="module" src="/src/orb.js"></script>
</body>
</html>
